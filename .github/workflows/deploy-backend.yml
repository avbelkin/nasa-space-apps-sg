name: Build and Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore backend/NasaSpaceApps.slnx

      - name: Build backend (Release)
        run: dotnet build backend/NasaSpaceApps.slnx --configuration Release --no-restore

  deploy-cloudrun:
    needs: build-check
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION || 'asia-southeast1' }}-docker.pkg.dev --quiet

      - name: Build and push container image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
          GCP_ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO || 'cloud-run-source-deploy' }}
          GCP_SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME || 'nasa-space-apps-api' }}
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPO}/${GCP_SERVICE_NAME}:${GITHUB_SHA}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "REGION=$GCP_REGION" >> "$GITHUB_ENV"
          echo "SERVICE=$GCP_SERVICE_NAME" >> "$GITHUB_ENV"

      - name: Prepare Cloud Run configuration
        env:
          GCP_MIN_INSTANCES: ${{ vars.GCP_MIN_INSTANCES }}
          GCP_MAX_INSTANCES: ${{ vars.GCP_MAX_INSTANCES }}
          GCP_CPU: ${{ vars.GCP_CPU }}
          GCP_MEMORY: ${{ vars.GCP_MEMORY }}
          GCP_CONCURRENCY: ${{ vars.GCP_CONCURRENCY }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          MIN_INSTANCES="${GCP_MIN_INSTANCES:-1}"
          MAX_INSTANCES="${GCP_MAX_INSTANCES:-4}"
          CPU="${GCP_CPU:-1}"
          MEMORY="${GCP_MEMORY:-1Gi}"
          CONCURRENCY="${GCP_CONCURRENCY:-80}"

          DEPLOY_FLAGS="--allow-unauthenticated --cpu-boost --min-instances=${MIN_INSTANCES} --max-instances=${MAX_INSTANCES} --cpu=${CPU} --memory=${MEMORY} --concurrency=${CONCURRENCY}"
          if [ -n "${GCP_RUNTIME_SERVICE_ACCOUNT}" ]; then
            DEPLOY_FLAGS="${DEPLOY_FLAGS} --service-account=${GCP_RUNTIME_SERVICE_ACCOUNT}"
          fi

          echo "DEPLOY_FLAGS=${DEPLOY_FLAGS}" >> "$GITHUB_ENV"
          echo "MIN_INSTANCES=${MIN_INSTANCES}" >> "$GITHUB_ENV"
          echo "MAX_INSTANCES=${MAX_INSTANCES}" >> "$GITHUB_ENV"
          echo "CPU=${CPU}" >> "$GITHUB_ENV"
          echo "MEMORY=${MEMORY}" >> "$GITHUB_ENV"
          echo "CONCURRENCY=${CONCURRENCY}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          secrets: ${{ vars.GCP_CLOUDRUN_SECRETS || '' }}
          env_vars: WeatherCache__Database=weather-cache
          flags: ${{ env.DEPLOY_FLAGS }}

      - name: Verify /health & write deployment summary
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT || 'default' }}
          SECRETS_CONFIG: ${{ vars.GCP_CLOUDRUN_SECRETS || 'none' }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${SERVICE_URL}/health"
          echo ""
          {
            echo "## Cloud Run Deployment Summary"
            echo ""
            echo "| Setting | Value |"
            echo "| :--- | :--- |"
            echo "| Service URL | \`${SERVICE_URL}\` |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Min / Max Instances | \`${MIN_INSTANCES}\` / \`${MAX_INSTANCES}\` |"
            echo "| CPU / Memory | \`${CPU}\` / \`${MEMORY}\` |"
            echo "| Concurrency | \`${CONCURRENCY}\` |"
            echo "| Runtime Service Account | \`${RUNTIME_SA}\` |"
            echo "| Secret Bindings | \`${SECRETS_CONFIG}\` |"
            echo ""
            echo "> Set GitHub repository variable \`VITE_API_BASE_URL=${SERVICE_URL}\` for the GitHub Pages UI build."
          } >> "$GITHUB_STEP_SUMMARY"
